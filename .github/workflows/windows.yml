name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'komikku/**'
      - 'data/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal

      - name: Build portable bundle
        shell: msys2 {0}
        run: bash windows/build.sh

      - name: Upload portable zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-windows-x64-portable
          path: _winbuild/Komikku-*-windows-x64.zip
          if-no-files-found: warn

      - name: Self-test (clean environment)
        shell: msys2 {0}
        run: bash windows/selftest.sh

      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          $version = (Get-Content _winbuild/version.txt).Trim()
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" windows\komikku.iss

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-windows-x64-installer
          path: _winbuild/Komikku-*-setup.exe
          if-no-files-found: warn
